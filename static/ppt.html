    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        black: '#000000',
                        onyx: '#09090b',
                        darkcard: '#082119',
                        accent: {
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                        },
                        gold: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                        }
                    }
                }
            }
        }

    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- html2pdf for PDF exporting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #000000;
            color: #f4f4f5;
            overflow-x: hidden;
        }

        /* 3D Glassmorphic Slide Card */
        .slide-3d {
            background: linear-gradient(145deg, #07261d 0%, #03130e 100%);
            border: 1px solid rgba(52, 211, 153, 0.25);
            box-shadow: 
                0 30px 40px -10px rgba(0, 0, 0, 0.9),
                0 0 30px rgba(16, 185, 129, 0.15),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.15);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .gold-border {
            border-color: rgba(251, 191, 36, 0.4) !important;
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.25) !important;
        }

        .btn-3d {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-3d:hover {
            transform: translateY(-2px) scale(1.03);
        }
    </style>
</head>

        let currentIdx = 0;
        let autoplayTimer = null;

        document.addEventListener('DOMContentLoaded', () => {
            initSelectDropdown();
            renderSlide(0);

            // Keyboard Arrow Listener
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === 'Space') nextSlide();
                else if (e.key === 'ArrowLeft') prevSlide();
            });
        });

        function initSelectDropdown() {
            const select = document.getElementById('slide-select');
            select.innerHTML = '';
            slides.forEach((s, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.innerText = `Slide ${s.number}: ${s.category}`;
                select.appendChild(opt);
            });
        }

        function renderSlide(idx) {
            currentIdx = idx;
            const slide = slides[idx];

            document.getElementById('slide-num-badge').innerText = `Slide ${slide.number} / 20`;
            document.getElementById('slide-category-badge').innerHTML = `<i class="fa-solid fa-star text-gold-400"></i> ${slide.category}`;
            document.getElementById('slide-title').innerText = slide.title;
            document.getElementById('slide-subtitle').innerText = slide.subtitle;

            const card = document.getElementById('active-slide-card');
            if (slide.number === 1 || slide.number === 20) {
                card.classList.add('gold-border');
            } else {
                card.classList.remove('gold-border');
            }

            // Bullets
            const container = document.getElementById('slide-bullets-container');
            container.innerHTML = (slide.bullets || []).map(b => `
                <div class="flex items-start space-x-3 p-2 rounded-xl hover:bg-forest-950/60 transition">
                    <i class="fa-solid fa-caret-right text-accent-400 text-lg mt-0.5 shrink-0"></i>
                    <span>${b}</span>
                </div>
            `).join('');

            // Quote
            document.getElementById('slide-quote-text').innerText = slide.quote;

            // Progress bar
            const percent = Math.round(((idx + 1) / slides.length) * 100);
            document.getElementById('slide-progress-bar').style.width = `${percent}%`;
            document.getElementById('progress-percent').innerText = `${percent}%`;

            // Update dropdown
            document.getElementById('slide-select').value = idx;
        }

        function nextSlide() {
            if (currentIdx < slides.length - 1) {
                renderSlide(currentIdx + 1);
            } else {
                renderSlide(0); // loop
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                renderSlide(currentIdx - 1);
            }
        }

        function goToSlide(idx) {
            if (idx >= 0 && idx < slides.length) {
                renderSlide(idx);
            }
        }

        function toggleAutoplay() {
            const btn = document.getElementById('autoplay-btn');
            if (autoplayTimer) {
                clearInterval(autoplayTimer);
                autoplayTimer = null;
                btn.innerHTML = `<i class="fa-solid fa-play text-accent-400"></i> Auto-Play`;
                btn.classList.remove('bg-accent-600', 'text-white');
            } else {
                autoplayTimer = setInterval(nextSlide, 5000);
                btn.innerHTML = `<i class="fa-solid fa-pause text-rose-400"></i> Pause`;
                btn.classList.add('bg-accent-600', 'text-white');
            }
        }

        function exportPresentationPDF() {
            const viewport = document.getElementById('slide-viewport');
            const opt = {
                margin:       [0.4, 0.4, 0.4, 0.4],
                filename:     `antigravity_3d_presentation_deck.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, backgroundColor: '#000000' },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'landscape' }
            };
            html2pdf().set(opt).from(viewport).save();
        }
    </script>
</body>
</html>
